name: Release

# 发版自动化：推送 vX.Y.Z tag → 构建 web 产物与网关二进制 → 创建 Release
# 附 CHANGELOG 对应版本段落。产物命名与 start.bat/Docker 部署对齐。
on:
  push:
    tags: ["v*.*.*", "v*.*.*-*"]

permissions:
  contents: write # 创建 Release 与上传产物

jobs:
  release:
    name: 构建 & 发布
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-go@v5
        with:
          go-version-file: gateway/go.mod

      - name: 安装依赖
        run: bun install --frozen-lockfile

      - name: 类型检查
        run: bun run typecheck:all

      - name: 构建前端产物
        working-directory: apps/web
        run: bunx vite build

      - name: 提取 CHANGELOG 对应版本段落
        id: notes
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          node -e '
            const fs = require("fs");
            const md = fs.readFileSync("CHANGELOG.md", "utf8");
            const tag = process.argv[1];
            const lines = md.split("\n");
            const start = lines.findIndex((l) => l.startsWith("## [v" + tag + "]"));
            if (start < 0) { console.log("## " + process.env.GITHUB_REF_NAME + "\n\n见提交历史。"); process.exit(0); }
            const body = [];
            for (let i = start + 1; i < lines.length; i++) {
              if (lines[i].startsWith("## [")) break;
              body.push(lines[i]);
            }
            while (body.length && !body[body.length - 1].trim()) body.pop();
            console.log(body.join("\n"));
          ' "$TAG" > RELEASE_NOTES.md

      - name: 打包产物
        run: |
          mkdir -p dist
          cp -r apps/web/dist dist/web
          cp -r apps/server/src dist/server-src
          cp -r packages/shared/src dist/shared-src
          cp package.json bun.lock compose.yaml panel.Dockerfile README.md CHANGELOG.md dist/
          tar -czf yatori-panel-web-${GITHUB_REF_NAME}.tar.gz -C dist .

      - name: 构建 Linux 网关
        working-directory: gateway
        run: go build -ldflags "-s -w" -o ../yatori-gateway-${GITHUB_REF_NAME}-linux-amd64 .

      - name: 构建 Windows 网关
        working-directory: gateway
        run: |
          GOOS=windows GOARCH=amd64 go build -ldflags "-s -w" -o ../yatori-gateway-${GITHUB_REF_NAME}-windows-amd64.exe .

      - name: 创建 Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: RELEASE_NOTES.md
          files: |
            yatori-panel-web-*.tar.gz
            yatori-gateway-*-linux-amd64
            yatori-gateway-*-windows-amd64.exe
