name: Release

# 发版自动化：推送 vX.Y.Z tag → 校验版本段 → 构建 web 产物与网关二进制 → 冒烟 → 创建 Release
# 仅产出 Linux 网关二进制：gateway 依赖 CGO（ddddocr-go OCR 运行库），
# Windows 交叉编译需 MinGW 且上游 onnx 运行库兼容性未知——Windows 用户
# 走 start.bat 本地构建或 Docker Compose（Linux 容器）部署。
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write # 创建 Release 与上传产物

jobs:
  release:
    name: 构建 & 发布
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # 需要 tag 与 main 的完整历史来校验"tag 已合入 main"
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - uses: actions/setup-go@v5
        with:
          go-version-file: gateway/go.mod

      - uses: actions/setup-node@v4
        with:
          # 与 panel.Dockerfile 的运行镜像保持一致（node:sqlite）
          node-version: 24

      - name: 安装依赖
        run: bun install --frozen-lockfile

      - name: 类型检查
        run: bun run typecheck:all

      # 发版前置校验：版本号格式、CHANGELOG 版本段非空、tag 已合入 main。
      # 任一不通过直接中断，不再静默降级为"见提交历史"。
      - name: 校验版本段与 tag
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          node scripts/check-release.mjs "${GITHUB_REF_NAME}" --require-main --notes-file RELEASE_NOTES.md

      - name: 构建前端产物
        working-directory: apps/web
        run: bun run build

      - name: 产物冒烟（启动后端验证健康接口）
        run: node scripts/smoke.mjs

      - name: 打包产物
        run: |
          mkdir -p dist
          cp -r apps/web/dist dist/web
          cp -r apps/server/src dist/server-src
          cp -r packages/shared/src dist/shared-src
          cp package.json bun.lock compose.yaml panel.Dockerfile README.md CHANGELOG.md dist/
          tar -czf yatori-panel-${GITHUB_REF_NAME}.tar.gz -C dist .

      - name: 校验压缩包内容
        run: |
          tar -tzf yatori-panel-${GITHUB_REF_NAME}.tar.gz > /tmp/tree.txt
          for f in web/index.html server-src/index.ts shared-src/index.ts compose.yaml panel.Dockerfile CHANGELOG.md; do
            grep -qx "./$f" /tmp/tree.txt || { echo "压缩包缺少 $f"; exit 1; }
          done

      - name: 构建 Linux 网关（CGO，OCR 依赖）
        working-directory: gateway
        run: go build -ldflags "-s -w" -o ../yatori-gateway-${GITHUB_REF_NAME}-linux-amd64 .

      - name: 创建 Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: RELEASE_NOTES.md
          files: |
            yatori-panel-*.tar.gz
            yatori-gateway-*-linux-amd64
