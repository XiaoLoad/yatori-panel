services:
  gateway:
    build: ./gateway
    restart: unless-stopped
    # 仅在容器网络内监听，面板后端经服务名访问，不对外发布端口

  panel:
    build:
      context: .
      dockerfile: panel.Dockerfile
    ports:
      - "8080:8080"
    environment:
      PANEL_HOST: 0.0.0.0
      GATEWAY_URL: http://gateway:9801
      PANEL_DATA_DIR: /app/data
      # 可选：加密密钥注入（base64 32 字节，openssl rand -base64 32 生成）。
      # 注入后密钥独立于数据卷，备份数据卷不再等于泄露账号密码。
      # PANEL_SECRET_KEY: ${PANEL_SECRET_KEY:-}
      # 可选：跨域访问白名单（逗号分隔 Origin），默认仅同源。
      # PANEL_CORS_ORIGINS: ${PANEL_CORS_ORIGINS:-}
    volumes:
      - panel-data:/app/data
    depends_on:
      - gateway
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

volumes:
  panel-data:
